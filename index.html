<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>World Creator</title>

    <link
        rel="manifest"
        href="./manifest.json">

    <meta
        name="theme-color"
        content="#ffffff">

    <link
        rel="stylesheet"
        href="./style.css">

</head>

<body>

    <header>

        <h1>

            World Creator

        </h1>

    </header>

    <section>

        <h2>

            世界

        </h2>

        <p>

            名前：

            <span id="world-name">

                -

            </span>

        </p>

        <p>

            レベル：

            <span id="world-level">

                1

            </span>

        </p>

        <p>

            レアリティ：

            <span id="world-rarity">

                1

            </span>

        </p>

    </section>

    <section>

        <h2>

            EP

        </h2>

        <p>

            <span id="ep-value">

                0

            </span>

        </p>

    </section>

    <nav>

        <button data-tab="world">

            世界

        </button>

        <button data-tab="research">

            研究

        </button>

        <button data-tab="upgrade">

            強化

        </button>

    </nav>

    <main>

        <section
            id="world-tab"
            class="tab-content">

            <h2>

                資源

            </h2>

            <div id="resource-list">

            </div>

        </section>

        <section
            id="research-tab"
            class="tab-content"
            hidden>

            <h2>

                研究

            </h2>

            <div id="research-list">

            </div>

        </section>

        <section
            id="upgrade-tab"
            class="tab-content"
            hidden>

            <h2>

                強化

            </h2>

            <div id="upgrade-list">

            </div>

        </section>

    </main>

    <section
        id="debug-panel"
        hidden>

        <h2>

            Debug

        </h2>

        <button
            id="debug-add-ep">

            EP+1000

        </button>

        <button
            id="debug-add-material">

            素材+1000

        </button>

        <br>

        <input
            id="debug-world-level"
            type="number"
            value="1">

        <button
            id="debug-set-world-level">

            世界Lv変更

        </button>

        <br>

        <button
            id="debug-reset">

            全データ削除

        </button>

    </section>

    <script
        type="module"
        src="./js/core/main.js">

    </script>

    <script>

        if (

            "serviceWorker"

            in

            navigator

        ) {

            window.addEventListener(

                "load",

                () => {

                    navigator
                        .serviceWorker
                        .register(
                            "./service-worker.js"
                        )

                        .catch(

                            error =>

                                console.error(
                                    error
                                )

                        );

                }

            );

        }

    </script>

</body>

</html>
