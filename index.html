<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="World Creator - 自分だけの世界を育てる放置ゲーム">
<link rel="manifest" href="./manifest.json">
<link rel="modulepreload" href="./js/core/main.js">
<link rel="modulepreload" href="./js/core/save.js">
<link rel="modulepreload" href="./js/core/game.js">
<link rel="modulepreload" href="./js/utils/OfflineProgress.js">
<link rel="modulepreload" href="./js/resource/Manager.js">
<link rel="modulepreload" href="./js/core/InputManager.js">
<link rel="modulepreload" href="./js/core/InputActionController.js">
<link rel="modulepreload" href="./js/ui/UI.js">
<link rel="stylesheet" href="./style.css?v=0.0.100">
<title>World Creator</title>
</head>
<body>
<header>
<h1>World Creator</h1>
<section id="status-panel">
<p>EP: <strong id="ep-value">0</strong></p>
<div id="resource-list"></div>
</section>
</header>
<nav aria-label="ゲームメニュー">
<button type="button" data-tab="world" aria-selected="true">世界</button>
<button type="button" data-tab="automation" aria-selected="false" hidden>自動化</button>
<button type="button" data-tab="statistics" aria-selected="false">統計・倍率</button>
<button type="button" data-tab="achievements" aria-selected="false">実績</button>
<button type="button" data-tab="settings" aria-selected="false">設定</button>
</nav>
<main>
<section id="world-tab" class="tab-content" data-tab-panel="world">
<h2>世界</h2>
<div class="world-category-tabs" role="tablist" aria-label="世界カテゴリ">
<button type="button" data-action="world:category" data-world-category="world" class="world-category-button active" aria-selected="true">世界</button>
<button type="button" data-action="world:category" data-world-category="converter" class="world-category-button" aria-selected="false">変換</button>
</div>
<div id="world-category-world" class="world-category-panel" data-world-category-panel="world">
<div id="world-list"></div>
<div id="next-world"><p class="next-world-cost">必要EP: 1e100 EP</p><button id="unlock-world" type="button" data-action="world:create:request">世界作成</button></div>

<section id="upgrade-panel" aria-label="強化">
<h3>強化</h3>
<div class="upgrade-subtabs" role="tablist" aria-label="強化カテゴリ">
<button type="button" data-upgrade-category="infinite" class="upgrade-category-button active" aria-selected="true">無限強化</button>
<button type="button" data-upgrade-category="limited" class="upgrade-category-button" aria-selected="false">回数制強化</button>
</div>
<div id="upgrade-infinite-panel" data-upgrade-category-panel="infinite">
<div id="upgrade-infinite-list"></div>
</div>
<div id="upgrade-limited-panel" data-upgrade-category-panel="limited" hidden>
<div id="upgrade-limited-list"></div>
</div>
</section>
</div>
<div id="world-category-converter" class="world-category-panel" data-world-category-panel="converter" hidden>
<div id="converter-list"></div>
</div>
</section>
<section id="automation-tab" class="tab-content" data-tab-panel="automation" hidden>
<h2>自動化</h2>
<div id="automation-content"></div>
</section>
<section id="achievements-tab" class="tab-content" data-tab-panel="achievements" hidden>
<h2>実績</h2>
<div id="achievement-content"></div>
</section>
<section id="statistics-tab" class="tab-content" data-tab-panel="statistics" hidden>
<div id="statistics-content"></div>
</section>
<section id="settings-tab" class="tab-content" data-tab-panel="settings" hidden>
<h2>設定</h2>
<label>数値表示:
<select id="settings-number-format"><option value="scientific">科学表記</option><option value="standard">通常表記</option><option value="engineering">工学表記</option></select>
</label>
<label>ゲーム更新間隔(ms): <input id="settings-tick-speed" type="number" min="1" step="1"></label>
<label>自動保存間隔(ms): <input id="settings-autosave" type="number" min="0" step="1000"></label>
<label>デバッグ: <input id="settings-debug" type="checkbox"></label>
<label>SpeedRun: <input id="settings-speedrun" type="checkbox"></label>
<label>言語:
<select id="settings-language"><option value="ja">日本語</option><option value="en">English</option></select>
</label>
<label>シード値:
<input id="settings-seed" type="text" placeholder="次回の世界作成に使用">
</label>
<button id="settings-seed-output" type="button">現在の世界のシード値を出力</button>
<div id="save-controls">
<h3>セーブ</h3>
<button id="save-button" type="button">手動保存</button>
<button id="load-button" type="button">保存データを再読み込み</button>
<button id="export-button" type="button">セーブ出力</button>
<button id="import-button" type="button">セーブ入力</button>
<button id="delete-save-button" type="button">セーブ削除</button>
</div>
<div id="debug-panel" hidden>
<h3>デバッグ</h3>
<button id="debug-add-ep" type="button">EP +1000</button>
<button id="debug-add-material" type="button">素材 +1000</button>
<label>世界Lv: <input id="debug-world-level" type="number" min="1" step="1" value="1"></label>
<button id="debug-set-world-level" type="button">世界Lv設定</button>
<button id="debug-reset" type="button">ゲームデータ初期化</button>
</div>
<div><h3>エラーログ</h3><div id="error-log"></div><button id="clear-error-log" type="button">エラーログ削除</button></div>
</section>
</main>
<div id="notification-container" aria-live="polite"></div>
<footer id="app-version">World Creator v0.0.100</footer>
<script type="module" src="./js/core/main.js?v=0.0.100"></script>
</body>
</html>
