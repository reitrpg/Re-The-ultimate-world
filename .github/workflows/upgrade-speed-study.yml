name: Upgrade Speed Study

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/upgrade-speed-study.cjs'
      - '.github/workflows/upgrade-speed-study.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-speed-study-main
  cancel-in-progress: true

jobs:
  upgrade-speed-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/world-creator-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null

      - name: Run deterministic upgrade speed study
        run: node tests/upgrade-speed-study.cjs

      - name: Upload speed study report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-creator-upgrade-speed-study
          path: |
            test-results/upgrade-speed-study.json
            test-results/upgrade-speed-study.csv
            test-results/upgrade-speed-study-summary.json
            /tmp/world-creator-http.log
          if-no-files-found: warn
