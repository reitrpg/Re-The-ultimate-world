name: Browser Gameplay Test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'tests/**'
      - 'service-worker.js'
      - 'css/**'
      - '.github/workflows/browser-gameplay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/world-creator-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null

      - name: Run browser gameplay checks
        run: node tests/browser-gameplay.cjs

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-creator-browser-gameplay-report
          path: |
            test-results/
            /tmp/world-creator-http.log
          if-no-files-found: warn
