name: Upgrade Buy-All and New-Birth Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'js/upgrades/**'
      - 'js/ui/UpgradeUI.js'
      - 'js/rebirth/**'
      - 'js/resource/**'
      - 'js/ep/**'
      - 'js/world/**'
      - 'tests/world-level-exp.cjs'
      - 'tests/upgrade-buy-all.cjs'
      - 'tests/newbirth-reset.cjs'
      - '.github/workflows/upgrade-buy-all.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-buy-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/world-creator-regression-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null

      - name: Stress test unlimited buy-all with debug 1e1000 EP
        run: node tests/upgrade-buy-all.cjs

      - name: Verify new-birth resource resets
        run: node tests/newbirth-reset.cjs

      - name: Verify multi-level world EXP progression
        run: node tests/world-level-exp.cjs
